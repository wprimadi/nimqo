name: Bug report
description: Something in NIMQO does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste phone numbers, message content, session files, or logs containing them.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: NIMQO version and macOS version
    validations:
      required: true
