[workspace]
resolver = "3"
members = ["crates/nimqo-ffi", "crates/nimqo-whatsapp"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"

[profile.release]
# ADR 0003: the core is embedded in the app, so a panic must unwind into an
# FFI error instead of aborting the UI.
panic = "unwind"
lto = "thin"

# Dependencies run optimised even in debug builds: unoptimised SRTP, video
# depacketising and Opus fell behind a call's video bursts, and 14% of video
# packets were lost on this Mac (a keyframe never arrived whole). NIMQO's own
# crates stay at debug settings.
[profile.dev.package."*"]
opt-level = 3
