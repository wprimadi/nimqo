[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained, not vulnerable. Reached only through UniFFI's bindgen at
    # build time (askama -> basic-toml); not in the shipped library. Remove
    # when UniFFI drops it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only via uniffi_bindgen; no upgrade available" },
    # SQLite < 3.54 can return stale page-cache memory when it opens a database
    # with a crafted -wal file. NIMQO opens only its own databases in its own
    # data folder; an attacker would already need write access there. No fix
    # is installable: diesel 2.3 caps libsqlite3-sys < 0.39, and 0.39's
    # bundled-sqlcipher still ships SQLite 3.53.4. Remove (here and in
    # .cargo/audit.toml) once SQLCipher bundles SQLite >= 3.54.
    { id = "RUSTSEC-2026-0459", reason = "own databases only; no patched SQLCipher build yet" },
]

[licenses]
# Permissive licenses compatible with shipping NIMQO under MIT (ADR 0007).
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The fork carries NIMQO's fixes on top of upstream until they land there
# (docs/UPSTREAM-COMPATIBILITY.md).
allow-git = ["https://github.com/oxidezap/whatsapp-rust", "https://github.com/wprimadi/whatsapp-rust"]
