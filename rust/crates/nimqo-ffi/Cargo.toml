[package]
name = "nimqo-ffi"
description = "UniFFI bridge between the NIMQO Swift app and the Rust core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
log = "0.4"
nimqo-whatsapp = { path = "../nimqo-whatsapp" }
oslog = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uniffi = { version = "0.32", features = ["cli"] }
whatsapp-rust = { git = "https://github.com/wprimadi/whatsapp-rust", rev = "ea798c73cc4aaf136ab24b61decdde7eb27da52f", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "tokio-native", "ureq-client"] }

[lints]
workspace = true
