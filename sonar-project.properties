# SonarQube Cloud. Disable Automatic Analysis in the project settings so CI
# analysis (and, later, coverage import) is used instead.
sonar.organization=wprimadi
sonar.projectKey=wprimadi_nimqo
sonar.projectName=NIMQO

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions must stay justified (plan section 16.6):
# - generated/: UniFFI bindings are build output, not hand-written code.
# - target/, build/, DerivedData/: build output.
sonar.exclusions=generated/**,**/target/**,build/**,DerivedData/**

# The gate itself is configured in SonarQube Cloud: "Sonar way" on new code,
# 80% coverage, 3% duplication, A ratings, all hotspots reviewed.
sonar.qualitygate.wait=true
