# Source of truth for the Xcode project. `xcodegen generate` writes
# NIMQO.xcodeproj, which is not committed. Use ../scripts/build-app.sh.
name: NIMQO
options:
  bundleIdPrefix: app.nimqo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-" # ad hoc; Developer ID arrives with the beta (Phase 7)
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  NimqoCore:
    type: framework
    platform: macOS
    sources: [Generated/Swift]
    dependencies:
      - framework: Generated/NimqoFFI.xcframework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        # Generated by UniFFI; it predates Swift 6 strict concurrency (ADR 0002).
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
  NIMQO:
    type: application
    platform: macOS
    sources: [NIMQO]
    dependencies:
      - target: NimqoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nimqo.dev
        PRODUCT_NAME: NIMQO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NIMQO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Wahyu Primadi. MIT License."
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        # ponytail: no App Sandbox yet; it moves the data dir and Keychain scope.
        # Decide with signing in Phase 7.
        ENABLE_HARDENED_RUNTIME: NO
  NIMQOTests:
    type: bundle.unit-test
    platform: macOS
    sources: [NIMQOTests]
    dependencies:
      - target: NIMQO
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NIMQO:
    build:
      targets:
        NIMQO: all
        NIMQOTests: [test]
    test:
      targets: [NIMQOTests]
